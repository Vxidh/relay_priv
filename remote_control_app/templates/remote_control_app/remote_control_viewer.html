<!DOCTYPE html>
<html>
<head>
    <title>Remote Control Viewer</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 1rem;
            margin: 0; /* Remove default body margin */
            overflow: hidden; /* Prevent scrollbars from showing */
        }

        #viewer-container {
            position: relative; /* For overlaying status or input elements */
            width: 100%;
            height: calc(100vh - 80px); /* Adjust height to fit screen, leaving space for header/status */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Ensure image doesn't overflow container */
        }

        #viewer {
            border: 2px solid #555;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Scale image down to fit, maintaining aspect ratio */
            cursor: crosshair; /* Indicates interactive area */
            display: block; /* Remove extra space below image */
            image-rendering: pixelated; /* For sharper low-res streams */
            image-rendering: crisp-edges;
        }

        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }

        #node-id-input {
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #555;
            background: #222;
            color: #eee;
        }

        #connect-button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        #connect-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Live Remote Control</h2>
    <input type="text" id="node-id-input" placeholder="Enter Node ID (6 chars)" maxlength="6" />
    <button id="connect-button">Connect</button>

    <div id="viewer-container">
        <img id="viewer" alt="Remote stream" />
    </div>
    <div id="status">Enter Node ID and click Connect.</div>

    <script>
        const nodeIdInput = document.getElementById("node-id-input");
        const connectButton = document.getElementById("connect-button");
        const viewer = document.getElementById("viewer");
        const statusDiv = document.getElementById("status");

        let ws = null; // WebSocket connection object
        let currentScaleX = 1;
        let currentScaleY = 1;

        // Function to get access token (assuming it's stored in localStorage after Django login)
        function getAccessToken() {
            return localStorage.getItem("access_token"); // Or get from cookie/session
        }

        function updateStatus(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.style.color = isError ? '#ff4d4d' : '#aaa';
        }

        function connectToRemoteControl(nodeId) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                updateStatus("Already connected. Disconnect first to change node.", true);
                return;
            }

            if (!nodeId || nodeId.length !== 6 || !/^[A-Za-z0-9]{6}$/.test(nodeId)) {
                updateStatus("Invalid Node ID. Must be 6 alphanumeric characters.", true);
                return;
            }

            const accessToken = getAccessToken();
            if (!accessToken || accessToken === "null") {
                updateStatus("No access token found. Please login via the Django UI first.", true);
                alert("You must be authenticated to view this node. Please login.");
                return;
            }

            updateStatus(`Attempting to connect to node ${nodeId}...`);

            // WebSocket URL for the RC Viewer, including node_id and access_token
            // This connects to your new remote_control_app.consumers.RemoteControlConsumer
            ws = new WebSocket(`ws://${location.host}/ws/rc-viewer/${nodeId}/?token=${accessToken}`);

            ws.onopen = () => {
                updateStatus(`Connected to node ${nodeId}`);
                console.log(`WebSocket opened for node ${nodeId}`);
                nodeIdInput.disabled = true; // Disable input after successful connection
                connectButton.textContent = "Disconnect";
                connectButton.onclick = disconnectRemoteControl; // Change button action
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "remote_control_frame" && msg.image_base64) {
                    viewer.src = `data:image/jpeg;base64,${msg.image_base64}`;
                    // Update scale factors when image loads to ensure accurate click coordinates
                    viewer.onload = () => {
                        currentScaleX = viewer.naturalWidth / viewer.clientWidth;
                        currentScaleY = viewer.naturalHeight / viewer.clientHeight;
                        viewer.onload = null; // Clear onload after first load
                    };
                } else if (msg.type === "status") {
                    updateStatus(`Server status: ${msg.message}`, msg.message.includes('disconnected') || msg.message.includes('offline'));
                } else {
                    console.warn("Received unknown message type or malformed frame:", msg);
                }
            };

            ws.onclose = (event) => {
                updateStatus(`Connection closed. Code: ${event.code}, Reason: ${event.reason}.`, true);
                console.log("WebSocket closed:", event);
                nodeIdInput.disabled = false;
                connectButton.textContent = "Connect";
                connectButton.onclick = () => connectToRemoteControl(nodeIdInput.value.trim());
                viewer.src = ""; // Clear the image
            };

            ws.onerror = (error) => {
                updateStatus(`WebSocket error: ${error.message || "Unknown error"}.`, true);
                console.error("WebSocket error:", error);
                ws.close(); // Attempt to close the socket cleanly
            };
        }

        function disconnectRemoteControl() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close(1000, "User initiated disconnect"); // 1000 is normal closure
            } else {
                updateStatus("Not currently connected.", true);
            }
        }

        // Event listener for the Connect button
        connectButton.onclick = () => connectToRemoteControl(nodeIdInput.value.trim());

        // Event listener for mouse clicks on the viewer image
        viewer.addEventListener("click", (e) => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                updateStatus("Not connected to send commands.", true);
                return;
            }

            const rect = viewer.getBoundingClientRect();
            // Calculate coordinates relative to the natural size of the image
            const x = Math.round((e.clientX - rect.left) * currentScaleX);
            const y = Math.round((e.clientY - rect.top) * currentScaleY);

            // Send mouse click command to the RC Consumer
            const payload = {
                type: "mouse_click", // This type will be mapped to commandType by RC Consumer
                params: {
                    x: x,
                    y: y,
                    button: "left", // Default to left button for now
                    clicks: 1,
                    // requestId will be generated by the RC Consumer
                }
            };
            ws.send(JSON.stringify(payload));
            console.log("Sent mouse click:", payload);
        });

        // Basic Keyboard Input (example for 'type_text')
        // You might want a dedicated overlay or input field for typing
        // For simplicity, let's capture key presses on the document for now,
        // but a more sophisticated solution would manage focus.
        document.addEventListener("keydown", (e) => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            // Prevent browser shortcuts for common keys
            if (e.key === 'Tab' || e.key === 'Backspace' || e.key === 'Enter') {
                e.preventDefault();
            }

            const payload = {
                type: "key_press", // Or 'type_text' for sequences
                params: {
                    key: e.key,
                    // Additional parameters like modifiers (shift, ctrl, alt)
                    // e.g., 'alt': e.altKey, 'ctrl': e.ctrlKey, 'shift': e.shiftKey
                }
            };
            ws.send(JSON.stringify(payload));
            console.log("Sent key press:", payload);
        });

        // Optionally, if you want a dedicated text input
        /*
        const textInputOverlay = document.createElement('input');
        textInputOverlay.type = 'text';
        textInputOverlay.placeholder = 'Type text here...';
        textInputOverlay.style.position = 'absolute';
        textInputOverlay.style.bottom = '10px';
        textInputOverlay.style.left = '50%';
        textInputOverlay.style.transform = 'translateX(-50%)';
        textInputOverlay.style.zIndex = '100';
        document.body.appendChild(textInputOverlay);
        textInputOverlay.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && ws && ws.readyState === WebSocket.OPEN) {
                const textToSend = textInputOverlay.value;
                const payload = {
                    type: "type_text",
                    params: {
                        text: textToSend
                    }
                };
                ws.send(JSON.stringify(payload));
                console.log("Sent typed text:", payload);
                textInputOverlay.value = ''; // Clear input
            }
        });
        */
    </script>
</body>
</html>
